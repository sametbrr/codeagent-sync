name: Release

# Push a tag like v0.1.0 to publish: the binaries and checksums.txt go to a
# GitHub release, and the npm package (npm/) is published with the same
# version when the repository has an NPM_TOKEN secret.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'

      - name: Test
        run: go test ./...

      - name: Build
        env:
          CGO_ENABLED: '0'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}"
            ext=""; [ "$GOOS" = windows ] && ext=".exe"
            GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/codeagent-sync-${GOOS}-${GOARCH}${ext}" ./cmd/codeagent-sync
          done
          cd dist && sha256sum codeagent-sync-* > checksums.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes

  npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::No NPM_TOKEN secret; skipping npm publish"
            exit 0
          fi
          # The package page shows the README packed with it (English only).
          cp README.md LICENSE THIRD_PARTY_NOTICES.md npm/
          cd npm
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
          npm publish --access public --provenance
